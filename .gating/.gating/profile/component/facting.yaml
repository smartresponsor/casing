component:
  name: Facting
  nameEntity: fact
  namespace: App\Facting
  business_prefix: Fact
  subject_prefix: Fact
  subject_tokens:
    - Fact
  database_prefix: fact_
  typed_layers_required: true
  service_interface_mirror: false

  route_owner_root: fact
  route_owner_roots:
    - fact
    - metrics
    - status
  route_excluded_sources:
    - src/Controller/FactHttpController.php
    - src/Controller/FactProjectionHttpController.php
    - src/Controller/FactProjectorToggleHttpController.php
  mutation_mode: forbidden

  secret_scan: enabled
  docblock_preservation: enabled
  release:
    evidence_required: false
    required_files:
      - composer.json
