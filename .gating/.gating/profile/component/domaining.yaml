component:
  name: Domaining
  namespace: App\Domaining
  business_prefix: Domain
  database_prefix: domain_
  enabled_rules:
    - structure.forbidden_architecture
    - namespace.profile_match
    - layer.typed_class_location
    - mirror.service_interface
    - composer.platform_constraint
    - database.table_prefix
    - mutation.safety_firewall

  route_owner_root: domain
  route_owner_roots:
    - domain
  mutation_mode: forbidden

  secret_scan: enabled
  release:
    evidence_required: false
    required_files:
      - MANIFEST.json
      - composer.json
