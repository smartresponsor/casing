services:
  _defaults:
    autowire: true
    autoconfigure: true

  _instanceof:
    App\Casing\Contract\CaseFormContributionInterface:
      tags: ['casing.form_contribution']

  App\Casing\Contract\CaseFormContributionRegistry:
    arguments:
      $providers: !tagged_iterator casing.form_contribution

  App\Casing\Contract\PurchasedProductSubjectResolverInterface:
    alias: App\Casing\Integration\Ordering\OrderingPurchasedProductSubjectResolver

  App\Casing\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Dto/'
      - '../src/Entity/'
      - '../src/Enum/'
      - '../src/Value/'
      - '../src/Contract/CaseFormContributionInterface.php'
      - '../src/Contract/PurchasedProductSubjectResolverInterface.php'
